services:
  sinusbot:
    image: ghcr.io/gamer92000/sinusbot-docker:latest
    container_name: sinusbot
    restart: unless-stopped
    # Run via bash so a host-mounted entrypoint without +x still works
    entrypoint: ["/bin/bash", "/opt/sinusbot/entrypoint.sh"]
    ports:
      - 9987:8087
    volumes:
      - ./scripts:/opt/sinusbot/scripts
      - ./data:/opt/sinusbot/data
      # Use local entrypoint (yt-dlp cookies wrapper) without rebuilding the image
      - ./entrypoint.sh:/opt/sinusbot/entrypoint.sh:ro
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  teamspeak:
    image: teamspeaksystems/teamspeak6-server:latest
    container_name: teamspeak
    restart: unless-stopped
    ports:
      - "9987:9987/udp"
      - "30033:30033/tcp" # file transfer
      - "10022:10022/tcp" # SSH, 'secure' Telnet
    environment:
      - TSSERVER_LICENSE_ACCEPTED=accept
    volumes:
      - ./teamspeak:/var/tsserver
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"